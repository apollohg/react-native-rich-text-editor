name: CI

on:
  push:
    branches:
      - v1
    paths-ignore: &non-release-paths
      - '**/*.md'
      - '**/*.mdx'
      - '**/docs/**'
      - 'plans/**'
      - 'specs/**'
      - 'wiki'
      - 'wiki/**'
      - 'assets/**'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *non-release-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
  ORG_GRADLE_PROJECT_kotlin.compiler.execution.strategy: in-process

jobs:
  javascript:
    runs-on: &linux-runner [self-hosted, Linux, X64, native-editor-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm --prefix example ci

      - name: Typecheck package
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Typecheck example
        run: npm run typecheck:example

      - name: Run JavaScript tests
        run: npm test

      - name: Validate npm package contents
        run: npm pack --dry-run

  rust:
    # The complete CRDT suite runs on every CI-triggering change.
    runs-on: *linux-runner
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageOS
          workspaces: rust/editor-core
          shared-key: editor-core
          cache-on-failure: true
          cache-workspace-crates: true
          key: ${{ github.job }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/tests/**', 'rust/editor-core/benches/**') }}

      - name: Run Rust tests
        run: npm run test:rust

  android-native:
    runs-on: *linux-runner
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        run: |
          sdkmanager --install 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageOS
          workspaces: rust/editor-core
          shared-key: editor-core
          cache-on-failure: true
          cache-workspace-crates: true
          key: ${{ github.job }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/tests/**', 'rust/editor-core/benches/**') }}

      - name: Cache Android native outputs
        id: native-build-cache
        uses: actions/cache@v5
        with:
          path: rust/android
          key: ci-native-android-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-ndk-4.1.2-android-27.1.12297006-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/*.toml', 'rust/editor-core/Cargo.lock', 'rust/editor-core/build.rs', 'rust/editor-core/.cargo/**', 'rust/vendor/**', 'rust/*.sh', 'rust/*.py', '.cargo/**', 'rust/.cargo/**', 'rust/bindings/**', 'ios/Generated_editor_core.swift', 'ios/editor_coreFFI/**') }}

      - name: Install cargo-ndk
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Validate Android native stripping
        run: bash scripts/tests/validate-native-stripping.sh android

      - name: Build editor-core for Android
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: bash rust/build-android.sh

      - name: Upload Android native outputs
        uses: actions/upload-artifact@v7
        with:
          name: ci-android-native
          path: rust/android
          if-no-files-found: error
          retention-days: 2

  android:
    needs: android-native
    runs-on: *linux-runner
    env: &x86-64-example-app
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        run: sdkmanager --install 'ndk;27.1.12297006'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageOS
          workspaces: rust/editor-core -> ../../android/build/host-editor-core
          shared-key: editor-core
          cache-on-failure: true
          cache-workspace-crates: true
          key: ${{ github.job }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/tests/**', 'rust/editor-core/benches/**') }}

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm --prefix example ci

      - name: Download Android native outputs
        uses: actions/download-artifact@v8
        with:
          name: ci-android-native
          path: rust/android

      - name: Run Android unit tests
        run: npm run test:android

      - name: Lint Kotlin sources
        run: npm run lint:kotlin

      - name: Run Android lint
        run: npm run lint:android

      - name: Assemble release AAR
        run: ./gradlew :apollohg_react-native-rich-text-editor:assembleRelease
        working-directory: example/android

  android-rn076:
    needs: android-native
    runs-on: *linux-runner
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        run: |
          sdkmanager --install 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Setup RN 0.76 Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;34.0.0'

      - name: Install root dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Download Android native outputs
        uses: actions/download-artifact@v8
        with:
          name: ci-android-native
          path: rust/android

      - name: Pack Android release candidate
        run: |
          mkdir -p release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact

      - name: Validate React Native 0.76 release consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d '[:space:]')" = 1
          tarball="$(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)"
          RELEASE_TARBALL="$tarball" npm run validate:package:android:rn076

  js-and-android:
    if: always()
    needs: [javascript, rust, android-native, android, android-rn076]
    runs-on: *linux-runner
    timeout-minutes: 5
    steps:
      - name: Require all JavaScript, Rust, and Android checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          for result in ${RESULTS//,/ }; do
            if [ "$result" != success ]; then
              echo "A required check did not succeed: $RESULTS" >&2
              exit 1
            fi
          done

  android-api-24:
    runs-on: *linux-runner
    env: *x86-64-example-app
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        run: sdkmanager --install 'ndk;27.1.12297006'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm --prefix example ci

      - name: Verify KVM access
        run: bash scripts/require-kvm.sh

      - name: Validate API 24 instrumentation result handling
        run: node scripts/tests/android-api24-instrumentation.test.mjs

      - name: Run API 24 instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 24
          arch: x86_64
          disable-animations: true
          script: npm run test:android:api24

  ios:
    runs-on: [self-hosted, macOS, ARM64, native-editor-ci]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.cargo-target
    # Includes cold Rust/native builds, XCTest, and result collection.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup iOS compiler cache
        id: ios-toolchain
        uses: ./.github/actions/ios-build-cache

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Lint Swift sources
        run: npm run lint:ios

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
          components: llvm-tools-preview

      - name: Install root dependencies
        run: npm ci

      - name: Restore iOS native outputs
        id: native-build-cache
        uses: actions/cache/restore@v5
        with:
          path: &ios-native-cache-paths |
            rust/bindings
            rust/ios
            ios/Generated_editor_core.swift
            ios/editor_coreFFI
            ios/EditorCore.xcframework
          key: ci-native-ios-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-${{ steps.ios-toolchain.outputs.xcode }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/*.toml', 'rust/editor-core/Cargo.lock', 'rust/editor-core/build.rs', 'rust/editor-core/.cargo/**', 'rust/vendor/**', 'rust/*.sh', 'rust/*.py', '.cargo/**', 'rust/.cargo/**', 'rust/bindings/**', 'ios/Generated_editor_core.swift', 'ios/editor_coreFFI/**') }}

      # The test host links EditorCore.xcframework, which is a build output
      # rather than a tracked file.
      - name: Build editor-core for iOS
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: npm run build:rust:ios

      - name: Validate iOS native stripping
        run: bash scripts/tests/validate-native-stripping.sh ios

      - name: Verify generated bindings are current
        run: git diff --exit-code -- rust/bindings ios/Generated_editor_core.swift ios/editor_coreFFI

      - name: Save iOS native outputs
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: *ios-native-cache-paths
          key: ${{ steps.native-build-cache.outputs.cache-primary-key }}

      - name: Install example dependencies
        run: npm --prefix example ci

      - name: Prepare iOS simulator
        id: ios-simulator
        shell: bash
        run: bash scripts/prepare-ios-simulator.sh

      - name: Prepare iOS test host
        uses: ./.github/actions/ios-test-host
        with:
          xcode: ${{ steps.ios-toolchain.outputs.xcode }}
        env:
          IOS_DESTINATION: ${{ steps.ios-simulator.outputs.destination }}

      - name: Run iOS unit tests
        run: npm run test:ios -- -resultBundlePath test-results/ios/NativeEditorTests.xcresult
        env:
          IOS_DESTINATION: ${{ steps.ios-simulator.outputs.destination }}
          NATIVE_EDITOR_IOS_TEST_ACTION: test-without-building

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: test-results/ios
          if-no-files-found: ignore
          retention-days: 2
