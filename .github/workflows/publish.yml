name: Publish / Dry Run

on:
    release:
        types:
            - published
    workflow_dispatch:
    push:
        branches: [main, v1]
        paths:
            - 'packages/**'
            - 'src/EditorAddon.ts'
            - 'ios/NativeCodeHighlighting.swift'
            - 'android/src/main/java/com/apollohg/editor/CodeHighlighting.kt'
            - '.github/workflows/publish.yml'
            - '.github/actions/**'
            - 'scripts/release-packages.mjs'
    pull_request:
        paths:
            - 'packages/**'
            - 'src/EditorAddon.ts'
            - 'ios/NativeCodeHighlighting.swift'
            - 'android/src/main/java/com/apollohg/editor/CodeHighlighting.kt'
            - '.github/workflows/publish.yml'
            - '.github/actions/**'
            - 'scripts/release-packages.mjs'

permissions:
    contents: read

env:
    GRADLE_OPTS: -Dorg.gradle.caching=true
    RELEASE_ARTIFACT_NAME: release-package-${{ github.run_id }}

jobs:
    build-package:
        runs-on: macos-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Identify native toolchain
              id: native-toolchain
              shell: bash
              run: |
                  set -euo pipefail
                  xcode_hash="$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
                  echo "xcode=$xcode_hash" >> "$GITHUB_OUTPUT"

            - name: Restore native build cache
              id: native-build-cache
              uses: actions/cache/restore@v5
              with:
                  path: |
                      rust/bindings
                      rust/ios
                      rust/android
                      ios/Generated_editor_core.swift
                      ios/editor_coreFFI
                      ios/EditorCore.xcframework
                  key: native-build-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-ndk-4.1.2-android-27.1.12297006-${{ steps.native-toolchain.outputs.xcode }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/*.toml', 'rust/editor-core/Cargo.lock', 'rust/editor-core/build.rs', 'rust/editor-core/.cargo/**', 'rust/*.sh', '.cargo/**', 'rust/.cargo/**') }}

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Setup Java
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Rust
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              uses: dtolnay/rust-toolchain@1.95.0
              with:
                  targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

            - name: Cache Cargo
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust/editor-core
                  shared-key: editor-core
                  cache-on-failure: true
                  cache-workspace-crates: true
                  key: ${{ github.job }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/tests/**', 'rust/editor-core/benches/**') }}

            - name: Install cargo-ndk
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  if ! cargo ndk --version >/dev/null 2>&1; then
                    cargo install cargo-ndk --version 4.1.2 --locked
                  fi

            - name: Setup Android SDK
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              uses: android-actions/setup-android@v4

            - name: Setup Android NDK
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  sdkmanager --install 'ndk;27.1.12297006'
                  echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: npm ci

            - name: Build editor-core for all shipping targets
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              run: |
                  bash rust/generate-bindings.sh
                  bash rust/build-ios.sh
                  bash rust/build-android.sh

            - name: Verify generated bindings are current
              run: git diff --exit-code -- rust/bindings ios/Generated_editor_core.swift ios/editor_coreFFI

            - name: Save native build cache
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: |
                      rust/bindings
                      rust/ios
                      rust/android
                      ios/Generated_editor_core.swift
                      ios/editor_coreFFI
                      ios/EditorCore.xcframework
                  key: ${{ steps.native-build-cache.outputs.cache-primary-key }}

            - name: Build package
              run: npm run build

            - name: Pack release artifact
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p release-artifact
                  npm pack --ignore-scripts --pack-destination release-artifact
                  test "$(find release-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d '[:space:]')" = 1

            - name: Upload release artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ env.RELEASE_ARTIFACT_NAME }}
                  retention-days: 2
                  if-no-files-found: error
                  path: |
                      release-artifact/*.tgz
                      scripts/resolve-npm-dist-tag.mjs
                      scripts/release-packages.mjs
                      dist
                      rust/bindings
                      rust/ios
                      rust/android
                      ios/Generated_editor_core.swift
                      ios/editor_coreFFI
                      ios/EditorCore.xcframework

    build-code-highlighting:
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Identify native toolchain
              id: native-toolchain
              shell: bash
              run: |
                  set -euo pipefail
                  xcode_hash="$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
                  echo "xcode=$xcode_hash" >> "$GITHUB_OUTPUT"

            - name: Restore native build cache
              id: native-build-cache
              uses: actions/cache/restore@v5
              with:
                  path: |
                      packages/code-highlighting/ios/NativeEditorHighlighting.xcframework
                      packages/code-highlighting/ios/Generated_highlighting.swift
                      packages/code-highlighting/ios/native_editor_highlightingFFI
                      packages/code-highlighting/android/src/main/jniLibs
                      packages/code-highlighting/android/src/main/java/uniffi
                  key: highlighting-native-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-ndk-4.1.2-android-27.1.12297006-${{ steps.native-toolchain.outputs.xcode }}-${{ hashFiles('packages/code-highlighting/rust/src/**', 'packages/code-highlighting/rust/*.toml', 'packages/code-highlighting/rust/Cargo.lock', 'packages/code-highlighting/rust-toolchain.toml', 'packages/code-highlighting/scripts/build-native.sh') }}

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Setup Java
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0
              with:
                  targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: packages/code-highlighting/rust
                  shared-key: code-highlighting
                  cache-on-failure: true
                  cache-workspace-crates: true
                  key: ${{ github.job }}-${{ hashFiles('packages/code-highlighting/rust/src/**', 'packages/code-highlighting/rust/tests/**') }}

            - name: Install cargo-ndk
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  if ! cargo ndk --version >/dev/null 2>&1; then
                    cargo install cargo-ndk --version 4.1.2 --locked
                  fi

            - name: Setup Android SDK
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              uses: android-actions/setup-android@v4

            - name: Setup Android NDK
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  sdkmanager --install 'ndk;27.1.12297006'
                  echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: npm ci

            - name: Build highlighting for all shipping targets
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              run: npm --prefix packages/code-highlighting run build:native

            - name: Verify generated bindings are current
              run: git diff --exit-code -- packages/code-highlighting/ios/Generated_highlighting.swift packages/code-highlighting/ios/native_editor_highlightingFFI packages/code-highlighting/android/src/main/java/uniffi

            - name: Save native build cache
              if: steps.native-build-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: |
                      packages/code-highlighting/ios/NativeEditorHighlighting.xcframework
                      packages/code-highlighting/ios/Generated_highlighting.swift
                      packages/code-highlighting/ios/native_editor_highlightingFFI
                      packages/code-highlighting/android/src/main/jniLibs
                      packages/code-highlighting/android/src/main/java/uniffi
                  key: ${{ steps.native-build-cache.outputs.cache-primary-key }}

            - name: Build package
              run: |
                  npm run build
                  npm --prefix packages/code-highlighting run build
                  npm test -- --runTestsByPath src/__tests__/CodeHighlightingAddon.test.ts src/__tests__/EditorAddon.test.ts
                  npm --prefix packages/code-highlighting run test:rust

            - name: Pack release artifact
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p code-highlighting-artifact
                  npm pack ./packages/code-highlighting --pack-destination code-highlighting-artifact
                  test "$(find code-highlighting-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d '[:space:]')" = 1

            - name: Upload release artifact
              uses: actions/upload-artifact@v7
              with:
                  name: code-highlighting-${{ github.run_id }}
                  retention-days: 2
                  if-no-files-found: error
                  path: |
                      code-highlighting-artifact/*.tgz
                      packages/code-highlighting/dist
                      packages/code-highlighting/ios/NativeEditorHighlighting.xcframework
                      packages/code-highlighting/ios/Generated_highlighting.swift
                      packages/code-highlighting/ios/native_editor_highlightingFFI
                      packages/code-highlighting/android/src/main/jniLibs
                      packages/code-highlighting/android/src/main/java/uniffi

    package-contracts:
        needs: build-package
        runs-on: macos-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      example/package-lock.json

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust/editor-core
                  shared-key: editor-core
                  cache-on-failure: true
                  cache-workspace-crates: true
                  key: ${{ github.job }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/tests/**', 'rust/editor-core/benches/**') }}

            - name: Install dependencies
              run: |
                  npm ci
                  npm --prefix example ci

            - name: Download release artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ env.RELEASE_ARTIFACT_NAME }}
                  path: .

            - name: Resolve release tarball
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(find release-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d '[:space:]')" = 1
                  tarball="$(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)"
                  echo "RELEASE_TARBALL=$(cd "$(dirname "$tarball")" && pwd -P)/$(basename "$tarball")" >> "$GITHUB_ENV"

            - name: Typecheck package and example
              run: |
                  npm run typecheck
                  npm run typecheck:example

            - name: Lint Swift sources
              run: npm run lint:ios

            - name: Run Rust tests
              run: npm run test:rust

            - name: Run JavaScript tests
              run: npm test

            - name: Validate source and release contracts
              run: |
                  node scripts/tests/validate-prepared-prose-viewer-cutover.mjs
                  npm run validate:security -- --release
                  node scripts/tests/validate-publish-lifecycle.mjs
                  node scripts/tests/sync-version.test.mjs
                  node scripts/tests/release-packages.test.mjs
                  node scripts/tests/ios-test-actions.test.mjs
                  bash ./scripts/tests/validate-generated-bindings.sh

            - name: Validate native artifact fixtures
              run: |
                  bash ./scripts/tests/validate-packed-xcframework.sh
                  VALIDATE_PACKED_PACKAGE_GROUP=static node scripts/tests/validate-packed-package.test.mjs

            - name: Validate exact packed artifact
              run: npm run validate:package:contracts

    security-rust-typescript:
        needs: build-package
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust/editor-core
                  shared-key: editor-core
                  cache-on-failure: true
                  cache-workspace-crates: true
                  key: ${{ github.job }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/tests/**', 'rust/editor-core/benches/**') }}

            - name: Install dependencies
              run: npm ci

            - name: Download release artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ env.RELEASE_ARTIFACT_NAME }}
                  path: .

            - name: Validate Rust and TypeScript security behavior
              run: npm run validate:security -- --release --behavior
              env:
                  SECURITY_BEHAVIOR_TARGETS: rust,typescript

    security-ios:
        needs: build-package
        runs-on: macos-latest
        timeout-minutes: 25
        env:
            NATIVE_EDITOR_IOS_DERIVED_DATA: ${{ github.workspace }}/.ci/ios-security
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup iOS compiler cache
              id: ios-toolchain
              uses: ./.github/actions/ios-build-cache

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      example/package-lock.json

            - name: Install dependencies
              run: |
                  npm ci
                  npm --prefix example ci

            - name: Download release artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ env.RELEASE_ARTIFACT_NAME }}
                  path: .

            - name: Identify iOS codegen inputs
              id: ios-codegen
              run: |
                  codegen_hash="$(node -p 'JSON.stringify(require("./package.json").codegenConfig)' | shasum -a 256 | cut -d ' ' -f 1)"
                  echo "hash=$codegen_hash" >> "$GITHUB_OUTPUT"

            - name: Restore compiled iOS test host
              id: ios-test-build
              uses: actions/cache/restore@v5
              with:
                  path: .ci/ios-security/Build/Products
                  key: ios-security-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-toolchain.outputs.xcode }}-${{ steps.ios-codegen.outputs.hash }}-${{ hashFiles('ios/**', 'ios-tests/**', 'common/cpp/**', 'ReactNativeProseEditor.podspec', 'src/specs/**', 'react-native.config.js', 'example/package-lock.json', 'scripts/run-ios-tests.sh', 'scripts/require-native-artifacts.sh') }}

            - name: Install iOS test dependencies
              run: npm run install:ios-test-pods


            - name: Build iOS security test host
              if: steps.ios-test-build.outputs.cache-hit != 'true'
              run: bash scripts/run-ios-tests.sh -only-testing:NativeEditorTests/RenderBridgeTests/testSharedWhitespaceBase64AndTrickleFixturesExecuteAgainstIOSBoundary
              env:
                  NATIVE_EDITOR_IOS_TEST_ACTION: build-for-testing

            - name: Save compiled iOS test host
              if: steps.ios-test-build.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: .ci/ios-security/Build/Products
                  key: ${{ steps.ios-test-build.outputs.cache-primary-key }}

            - name: Validate iOS security behavior
              run: npm run validate:security -- --release --behavior
              env:
                  SECURITY_BEHAVIOR_TARGETS: ios
                  NATIVE_EDITOR_IOS_TEST_ACTION: test-without-building

    security-android:
        needs: build-package
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      example/package-lock.json

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust/editor-core -> ../../android/build/host-editor-core
                  shared-key: editor-core-host
                  cache-workspace-crates: true
                  key: ${{ hashFiles('rust/editor-core/src/**') }}

            - name: Setup Android SDK
              uses: android-actions/setup-android@v4

            - name: Setup Android NDK
              run: sdkmanager --install 'ndk;27.1.12297006'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5
              with:
                  cache-read-only: ${{ github.event_name == 'pull_request' }}

            - name: Install dependencies
              run: |
                  npm ci
                  npm --prefix example ci

            - name: Download release artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ env.RELEASE_ARTIFACT_NAME }}
                  path: .

            - name: Validate Android security behavior
              run: npm run validate:security -- --release --behavior
              env:
                  SECURITY_BEHAVIOR_TARGETS: android

            - name: Reject invalid Android security fixture
              run: node scripts/tests/validate-security-contracts-negative.mjs

    ios-consumer-positive:
