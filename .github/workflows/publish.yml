    android-release-validation:
        strategy:
            fail-fast: false
            matrix:
                check: [jvm-lint, rn076, api24]
        needs: [build-package, build-code-highlighting]
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      example/package-lock.json

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      rust/editor-core
                      rust/editor-core -> ../../android/build/host-editor-core
                  shared-key: editor-core
                  cache-on-failure: true
                  cache-workspace-crates: true
                  key: ${{ github.job }}-${{ hashFiles('rust/editor-core/src/**', 'rust/editor-core/tests/**', 'rust/editor-core/benches/**') }}

            - name: Setup Android SDK
              uses: android-actions/setup-android@v4

            - name: Setup Android NDK
              run: sdkmanager --install 'ndk;27.1.12297006'

            - name: Setup RN 0.76 Android SDK
              run: sdkmanager --install 'platforms;android-36' 'build-tools;34.0.0'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5
              with:
                  cache-read-only: ${{ github.event_name == 'pull_request' }}

            - name: Install dependencies
              run: |
                  npm ci
                  npm --prefix example ci

            - name: Download release artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ env.RELEASE_ARTIFACT_NAME }}
                  path: .

            - name: Download highlighting artifact
              uses: actions/download-artifact@v8
              with:
                  name: code-highlighting-${{ github.run_id }}
                  path: .

            - name: Resolve release tarball
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(find release-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d '[:space:]')" = 1
                  tarball="$(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)"
                  echo "RELEASE_TARBALL=$(cd "$(dirname "$tarball")" && pwd -P)/$(basename "$tarball")" >> "$GITHUB_ENV"

            - name: Run Android JVM tests
              if: matrix.check == 'jvm-lint'
              run: npm run test:android

            - name: Lint Kotlin sources
              if: matrix.check == 'jvm-lint'
              run: npm run lint:kotlin

            - name: Run Android lint
              if: matrix.check == 'jvm-lint'
              run: npm run lint:android

            - name: Assemble release AAR
              if: matrix.check == 'jvm-lint'
              run: ./gradlew :apollohg_react-native-rich-text-editor:assembleRelease :apollohg-react-native-rich-text-editor-code-highlighting:assembleRelease
              working-directory: example/android

            - name: Validate React Native 0.76 release consumer
              if: matrix.check == 'rn076'
              run: npm run validate:package:android:rn076

            - name: Enable KVM
              if: matrix.check == 'api24'
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run API 24 instrumentation smoke test
              if: matrix.check == 'api24'
              uses: reactivecircus/android-emulator-runner@v2.38.0
              with:
                  api-level: 24
                  arch: x86_64
                  disable-animations: true
                  script: npm run test:android:api24

    publish:
        needs:
            - build-package
            - build-code-highlighting
            - package-contracts
            - security-rust-typescript
            - security-ios
            - security-android
            - ios-consumer-positive
            - ios-consumer-negative
            - android-consumer-positive
            - android-consumer-negative
            - android-release-validation
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Download release artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ env.RELEASE_ARTIFACT_NAME }}
                  path: .

            - name: Download highlighting artifact
              uses: actions/download-artifact@v8
              with:
                  name: code-highlighting-${{ github.run_id }}
                  path: .

            - name: Resolve release tarball
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(find release-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d '[:space:]')" = 1
                  tarball="$(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)"
                  echo "RELEASE_TARBALL=$(cd "$(dirname "$tarball")" && pwd -P)/$(basename "$tarball")" >> "$GITHUB_ENV"

            - name: Collect release packages
              run: cp code-highlighting-artifact/*.tgz release-artifact/

            - name: Publish to npm
              if: github.event_name == 'release' && github.event.action == 'published'
              run: node scripts/release-packages.mjs release-artifact

            - name: Validate npm artifact locally
              if: github.event_name != 'release'
              run: node scripts/release-packages.mjs release-artifact --dry-run
