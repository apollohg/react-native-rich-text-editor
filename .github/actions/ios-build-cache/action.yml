name: iOS build tools and compiler cache
description: Configure CocoaPods and reuse C and C++ compiler outputs on the Mac runner.
outputs:
    xcode:
        description: Selected Xcode toolchain fingerprint.
        value: ${{ steps.toolchain.outputs.xcode }}
runs:
    using: composite
    steps:
        - name: Configure iOS build tools and compiler cache
          id: toolchain
          shell: bash
          run: |
              if ! command -v ccache >/dev/null; then brew install ccache; fi
              if ! command -v pod >/dev/null; then brew install cocoapods; fi
              echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
              echo 'USE_CCACHE=1' >> "$GITHUB_ENV"
              echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"
              echo "CCACHE_DIR=$HOME/.cache/native-editor-ccache" >> "$GITHUB_ENV"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
              echo 'CCACHE_MAXSIZE=1G' >> "$GITHUB_ENV"
