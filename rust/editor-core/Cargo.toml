[package]
name = "editor-core"
version = "2.0.5"
edition = "2021"
rust-version = "1.95"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "editor_core"

[dependencies]
uniffi = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }
serde_stacker = "0.1"
stacker = "0.1"
smallvec = "1.13"
scraper = "0.21"
ego-tree = "0.9"
regex = "1"
memchr = "2"
sha2 = { version = "0.10", features = ["asm"] }
yrs = { version = "=0.27.4", features = ["sync"] }
base64 = "0.22"

[dev-dependencies]
proptest = "1"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]
crdt = [] # Phase 2
table-interop = ["yrs/history-audit"]

[[example]]
name = "table_interop_peer"
path = "examples/table_interop_peer.rs"
required-features = ["table-interop"]

[[bench]]
name = "perf_suite"
harness = false

[patch.crates-io]
yrs = { path = "../vendor/yrs" }
