[package]
name = "editor-core"
version = "2.2.0"
edition = "2021"
rust-version = "1.95"

# Keep exhaustive CRDT tests fast without disabling debug-only invariants.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "editor_core"

[dependencies]
uniffi = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }
serde_stacker = "0.1"
stacker = "0.1"
smallvec = "1.13"
scraper = "0.21"
cssparser = "0.34"
html5ever = "0.29.1"
ego-tree = "0.9"
regex = "1"
memchr = "2"
sha2 = { version = "0.10", features = ["asm"] }
yrs = { version = "=0.28.0", features = ["sync"] }
base64 = "0.22"

[dev-dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
proptest = "1"

[build-dependencies]
cc = "1"
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]
crdt = [] # Phase 2
table-interop = ["yrs/history-audit"]

[[example]]
name = "table_interop_peer"
path = "examples/table_interop_peer.rs"
required-features = ["table-interop"]

[[bench]]
name = "perf_suite"
harness = false

[[test]]
name = "android_allocator_thread_exit"
harness = false

[[test]]
name = "android_allocator_document_release"
harness = false

[[example]]
name = "perf_release"
path = "benches/perf_suite.rs"

[patch.crates-io]
yrs = { path = "../vendor/yrs" }
sha2 = { path = "../vendor/sha2" }
libmimalloc-sys = { path = "../vendor/libmimalloc-sys" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
jni-sys = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
mimalloc = "=0.1.52"
libmimalloc-sys = { version = "=0.1.49", features = ["secure_guards"] }

[target.'cfg(target_os = "android")'.dev-dependencies]
libmimalloc-sys = { version = "=0.1.49", features = ["extended"] }
